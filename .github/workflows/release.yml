name: Deployment workflow
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Semantic version number to release'
        required: true
      spotify_test_client_token:
        description: 'Spotify client redirect token (for client tests before release)'
        required: true
      spotify_test_redirect_uri:
        description: 'Spotify redirect uri'
        required: true
env:
  GITHUB_USERNAME: actions
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SPOTIFY_API_PUBLISH_VERSION: ${{ github.event.inputs.release_version }}
jobs:
  release_android_jvm_linux_js:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out repo
        uses: actions/checkout@v2
      - name: Install java 11
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '17'
      - name: Install curl
        run: sudo apt-get install -y curl libcurl4-openssl-dev
      - name: Publish JVM/Linux/Android
        run: ./gradlew publishKotlinMultiplatformPublicationToGitHubPackagesRepository publishJvmPublicationToGitHubPackagesRepository publishAndroidPublicationToGitHubPackagesRepository publishLinuxX64PublicationToGitHubPackagesRepository publishJsPublicationToGitHubPackagesRepository
      - name: Archive test results
        uses: actions/upload-artifact@v2
        with:
          name: code-coverage-report
          path: build/reports
        if: always()
  release_mac:
    runs-on: macos-latest
    environment: release
    needs: release_android_jvm_linux_js
    steps:
      - name: Check out repo
        uses: actions/checkout@v2
      - name: Install java 11
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '17'
      - name: Publish macOS/iOS
        run: ./gradlew publishMacosX64PublicationToGitHubPackagesRepository publishIosX64PublicationToGitHubPackagesRepository publishIosArm64PublicationToGitHubPackagesRepository
  release_windows:
    runs-on: windows-latest
    environment: release
    needs: release_android_jvm_linux_js
    steps:
      - name: Check out repo
        uses: actions/checkout@v2
      - name: Install java 11
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '17'
      - run: choco install curl
      - name: Publish windows
        run: ./gradlew publishMingwX64PublicationToGitHubPackagesRepository